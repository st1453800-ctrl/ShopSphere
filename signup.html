<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ShopSphere</title>
    <meta name="description" content="Create a new ShopSphere account to start shopping.">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- External Global Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary-blue: #2874f0;
            --secondary-orange: #ff9f00;
            --accent-red: #fb641b;
            --success-green: #388e3c;
            --bg-light: #f1f3f6;
            --text-dark: #212121;
            --text-light: #878787;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-container {
            display: flex;
            background: white;
            width: 850px;
            height: 540px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .auth-sidebar {
            background: linear-gradient(135deg, #172337, var(--primary-blue));
            color: white;
            padding: 40px;
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .auth-sidebar h2 {
            font-size: 28px;
            margin-bottom: 12px;
            font-style: italic;
        }

        .auth-sidebar p {
            font-size: 15px;
            color: #d0e1fd;
            line-height: 1.6;
        }

        .auth-form-box {
            padding: 40px;
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-form-box h2 {
            margin-bottom: 20px;
            color: var(--text-dark);
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
        }

        .submit-btn {
            width: 100%;
            background: var(--secondary-orange);
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent-red);
        }

        .auth-footer-text {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .auth-footer-text a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer-text a:hover {
            text-decoration: underline;
        }

        .back-home-link {
            display: inline-block;
            margin-bottom: 10px;
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-home-link:hover {
            text-decoration: underline;
        }

        /* Toast Notification */
        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #212121;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }

        #toast-notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        #toast-notification i {
            color: #2ed573;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Left Sidebar -->
        <div class="auth-sidebar">
            <div>
                <a href="index.html" style="color:white; text-decoration:none;"><h2 style="margin-bottom:5px;">ShopSphere</h2></a>
                <p>Sign up with your mobile number or email to start exploring our professional e-commerce catalog.</p>
            </div>
            <div style="font-size: 54px; color: rgba(255,255,255,0.15);">
                <i class="fas fa-user-plus"></i>
            </div>
            <div style="font-size: 12px; color: #d0e1fd;">&copy; 2026 ShopSphere Inc. All rights reserved.</div>
        </div>

        <!-- Right Form Box -->
        <div class="auth-form-box">
            <a href="index.html" class="back-home-link"><i class="fas fa-arrow-left"></i> Back to Storefront</a>
            <h2>Looks like you're new here!</h2>
            
            <form onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" required placeholder="Rahul Sharma">
                </div>
                <div class="input-group">
                    <label>Mobile Number or Email</label>
                    <input type="text" id="signupIdentifier" required placeholder="9876543210 or user@shopsphere.com">
                </div>
                <div class="input-group">
                    <label>Create Password</label>
                    <input type="password" id="signupPassword" required placeholder="At least 6 characters">
                </div>
                <button type="submit" class="submit-btn">Continue</button>
            </form>

            <div class="auth-footer-text">
                Already have an account? <a href="login.html">Existing User? Log in</a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Account created successfully!</span>
    </div>

    <!-- Signup Logic -->
    <script>
        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const identifier = document.getElementById('signupIdentifier').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            // Save user session in localStorage
            localStorage.setItem('shopSphereUser', identifier);
            localStorage.setItem('shopSphereUserName', name);

            showToast("Account created successfully! Redirecting...");

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
