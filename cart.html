<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopSphere</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2874f0;
            --secondary-orange: #ff9f00;
            --success-green: #388e3c;
            --accent-red: #fb641b;
            --bg-light: #f1f3f6;
            --text-dark: #212121;
            --text-light: #878787;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 60px;
        }

        /* Top Header */
        header {
            background-color: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 5%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            cursor: pointer;
        }

        .logo span { color: var(--secondary-orange); }

        .nav-links { display: flex; gap: 20px; }
        .nav-link { color: white; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .nav-link:hover { color: var(--secondary-orange); }

        /* Main Page Layout */
        .cart-wrapper {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 25px;
        }

        @media(max-width: 900px) {
            .cart-wrapper { grid-template-columns: 1fr; }
        }

        /* Free Delivery Banner */
        .delivery-banner {
            background: white;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--secondary-orange);
            grid-column: 1 / -1;
        }

        .progress-track {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--success-green);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Card Container */
        .card-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: var(--text-dark);
        }

        /* Cart Item Row */
        .cart-item {
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .cart-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .cart-item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .cart-item-details { flex: 1; }

        .item-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .item-delivery {
            font-size: 12px;
            color: var(--success-green);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .item-price-box {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .item-price-box span {
            font-size: 13px;
            color: var(--text-light);
            text-decoration: line-through;
            font-weight: normal;
            margin-left: 8px;
        }

        .item-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { background: #e0e0e0; }

        .qty-number {
            font-size: 15px;
            font-weight: bold;
            width: 25px;
            text-align: center;
        }

        .item-action-buttons {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .wishlist-btn { color: var(--primary-blue); }
        .remove-btn { color: #d32f2f; }
        .action-btn:hover { opacity: 0.8; }

        /* Promo Code Section */
        .promo-input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .promo-input-group input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .promo-apply-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .promo-tags {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .promo-tag {
            background: #e3f2fd;
            color: var(--primary-blue);
            border: 1px dashed var(--primary-blue);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Price Details Sidebar */
        .price-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 14px;
            color: #555;
        }

        .price-row.total {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-dark);
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--secondary-orange);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            margin-top: 18px;
            transition: background 0.2s;
        }

        .checkout-btn:hover { background-color: var(--accent-red); }

        /* Trust Badges */
        .trust-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-light);
            text-align: center;
        }

        .trust-grid div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .trust-grid i { font-size: 16px; color: var(--success-green); }

        /* Empty Cart State */
        .empty-cart-view {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 8px;
            grid-column: 1 / -1;
        }

        .empty-cart-view i { font-size: 65px; color: #ccc; margin-bottom: 15px; }

        /* Toast Popup */
        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #212121;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #toast-notification.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo" onclick="window.location.href='index.html'">Shop<span>Sphere</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="product.html" class="nav-link"><i class="fas fa-th-large"></i> Products</a>
            <a href="wishlist.html" class="nav-link"><i class="fas fa-heart"></i> Wishlist</a>
        </div>
    </header>

    <!-- Main Wrapper -->
    <main class="cart-wrapper" id="cart-main-wrapper">
        <!-- Rendered dynamically via JS -->
    </main>

    <!-- Toast Notification -->
    <div id="toast-notification">
        <i class="fas fa-check-circle" style="color:#2ed573;"></i>
        <span id="toast-message">Action completed successfully!</span>
    </div>

    <!-- Script Logic -->
    <script>
        let appliedCouponDiscount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });

        function renderCartPage() {
            const wrapper = document.getElementById('cart-main-wrapper');
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];

            if (cart.length === 0) {
                wrapper.style.gridTemplateColumns = '1fr';
                wrapper.innerHTML = `
                    <div class="empty-cart-view">
                        <i class="fas fa-shopping-cart"></i>
                        <h2>Your Shopping Cart is Empty</h2>
                        <p style="color: #777; font-size: 14px; margin-top: 5px;">Add products from our catalog to start shopping!</p>
                        <button class="checkout-btn" style="width: auto; display: inline-block; padding: 10px 30px; margin-top: 20px;" onclick="window.location.href='product.html'">Shop Now</button>
                    </div>
                `;
                return;
            }

            wrapper.style.gridTemplateColumns = '1fr 360px';

            let totalMrp = 0;
            let totalSelling = 0;
            let itemsHtml = '';

            cart.forEach((item, index) => {
                const itemMrp = item.price * 1.4;
                totalMrp += itemMrp * item.qty;
                totalSelling += item.price * item.qty;

                itemsHtml += `
                    <div class="cart-item">
                        <img src="${item.image}" class="cart-item-image" alt="${item.title}">
                        <div class="cart-item-details">
                            <div class="item-name">${item.title}</div>
                            <div class="item-delivery"><i class="fas fa-truck"></i> Express Delivery by Tomorrow</div>
                            <div class="item-price-box">
                                ₹${item.price.toLocaleString('en-IN')}
                                <span>₹${Math.round(itemMrp).toLocaleString('en-IN')}</span>
                            </div>
                            
                            <div class="item-controls-row">
                                <div class="quantity-box">
                                    <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                                    <span class="qty-number">${item.qty}</span>
                                    <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                                </div>
                                <div class="item-action-buttons">
                                    <button class="action-btn wishlist-btn" onclick="moveToWishlist(${index})">
                                        <i class="fas fa-heart"></i> Move to Wishlist
                                    </button>
                                    <button class="action-btn remove-btn" onclick="removeItem(${index})">
                                        <i class="fas fa-trash"></i> Remove
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            const freeDeliveryThreshold = 1500;
            const progressPercent = Math.min(100, Math.round((totalSelling / freeDeliveryThreshold) * 100));
            const diffAmount = freeDeliveryThreshold - totalSelling;

            const totalSavings = (totalMrp - totalSelling) + appliedCouponDiscount;
            const finalPayable = Math.max(0, totalSelling - appliedCouponDiscount);

            wrapper.innerHTML = `
                <!-- Free Delivery Banner -->
                <div class="delivery-banner">
                    <div style="font-size: 13px; font-weight: 600; color: var(--text-dark);" id="delivery-msg">
                        ${totalSelling >= freeDeliveryThreshold ? 
                            '<i class="fas fa-check-circle" style="color: var(--success-green);"></i> You have unlocked <strong>FREE Express Delivery!</strong>' : 
                            `<i class="fas fa-shipping-fast" style="color: var(--primary-blue);"></i> Add <strong>₹${diffAmount.toLocaleString('en-IN')}</strong> more to unlock <strong>FREE Express Delivery!</strong>`}
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
                    </div>
                </div>

                <!-- Left: Items List -->
                <div class="card-container">
                    <div class="card-title">My Cart (${cart.length} Items)</div>
                    ${itemsHtml}
                </div>

                <!-- Right: Promo & Price Summary Sidebar -->
                <div>
                    <!-- Promo Code Box -->
                    <div class="card-container" style="margin-bottom: 20px;">
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px;">Apply Promo Code</div>
                        <div class="promo-tags">
                            <span class="promo-tag" onclick="applyCoupon('SAVE20')">SAVE20</span>
                            <span class="promo-tag" onclick="applyCoupon('FREESHIP')">FREESHIP</span>
                            <span class="promo-tag" onclick="applyCoupon('SHOP100')">SHOP100</span>
                        </div>
                        <div class="promo-input-group">
                            <input type="text" id="couponCodeInput" placeholder="Enter coupon code">
                            <button class="promo-apply-btn" onclick="applyCouponInput()">Apply</button>
                        </div>
                    </div>

                    <!-- Price Details -->
                    <div class="card-container">
                        <div class="card-title">Price Details</div>
                        
                        <div class="price-row">
                            <span>Total MRP</span>
                            <span>₹${Math.round(totalMrp).toLocaleString('en-IN')}</span>
                        </div>
                        <div class="price-row">
                            <span>Discount on MRP</span>
                            <span style="color: var(--success-green);">- ₹${Math.round(totalMrp - totalSelling).toLocaleString('en-IN')}</span>
                        </div>
                        <div class="price-row">
                            <span>Coupon Discount</span>
                            <span style="color: var(--success-green);">- ₹${appliedCouponDiscount.toLocaleString('en-IN')}</span>
                        </div>
                        <div class="price-row">
                            <span>Delivery Charges</span>
                            <span style="color: var(--success-green);">${totalSelling >= freeDeliveryThreshold ? 'FREE' : '₹40'}</span>
                        </div>
                        <div class="price-row total">
                            <span>Total Amount</span>
                            <span>₹${finalPayable.toLocaleString('en-IN')}</span>
                        </div>
                        <p style="color: var(--success-green); font-weight: 600; font-size: 12px; margin-bottom: 15px;">You will save ₹${Math.round(totalSavings).toLocaleString('en-IN')} on this order!</p>

                        <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>

                        <!-- Trust Badges -->
                        <div class="trust-grid">
                            <div>
                                <i class="fas fa-lock"></i>
                                <span>100% Secure<br>Payments</span>
                            </div>
                            <div>
                                <i class="fas fa-undo"></i>
                                <span>Easy 7-Day<br>Returns</span>
                            </div>
                            <div>
                                <i class="fas fa-shield-alt"></i>
                                <span>Verified<br>Authentic</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];
            if (cart[index]) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                    showToast("Item removed from cart.");
                }
                localStorage.setItem('shopSphereCart', JSON.stringify(cart));
                renderCartPage();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];
            let item = cart[index];
            cart.splice(index, 1);
            localStorage.setItem('shopSphereCart', JSON.stringify(cart));
            renderCartPage();
            showToast(`Removed "${item.title}" from cart.`);
        }

        function moveToWishlist(index) {
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];
            let item = cart[index];
            if (item) {
                let wishlist = JSON.parse(localStorage.getItem('shopSphereWishlist')) || [];
                if (!wishlist.includes(item.title)) {
                    wishlist.push(item.title);
                    localStorage.setItem('shopSphereWishlist', JSON.stringify(wishlist));
                }
                cart.splice(index, 1);
                localStorage.setItem('shopSphereCart', JSON.stringify(cart));
                renderCartPage();
                showToast(`Moved "${item.title}" to Wishlist!`);
            }
        }

        function applyCoupon(code) {
            document.getElementById('couponCodeInput').value = code;
            applyCouponInput();
        }

        function applyCouponInput() {
            const val = document.getElementById('couponCodeInput').value.trim().toUpperCase();
            if (val === 'SAVE20') {
                appliedCouponDiscount = 200;
                showToast("Coupon 'SAVE20' applied! Saved ₹200.");
            } else if (val === 'FREESHIP') {
                appliedCouponDiscount = 40;
                showToast("Coupon 'FREESHIP' applied!");
            } else if (val === 'SHOP100') {
                appliedCouponDiscount = 100;
                showToast("Coupon 'SHOP100' applied! Saved ₹100.");
            } else {
                showToast("Invalid promo code.");
                return;
            }
            renderCartPage();
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
