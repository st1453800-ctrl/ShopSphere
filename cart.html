<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopSphere 2026</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2874f0;
            --secondary-orange: #ff9f00;
            --success-green: #388e3c;
            --accent-red: #fb641b;
            --bg-light: #f1f3f6;
            --text-dark: #212121;
            --text-light: #878787;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }

        /* Header Navigation */
        header {
            background-color: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 4%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            cursor: pointer;
        }

        .logo span {
            color: var(--secondary-orange);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-left: 20px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--secondary-orange);
        }

        /* Full Width Container */
        .cart-main-container {
            width: 100%;
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Free Delivery Progress Banner */
        .delivery-progress-banner {
            background: #fff;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--secondary-orange);
        }

        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--success-green);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Layout Grid */
        .cart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        @media(max-width: 900px) {
            .cart-grid {
                grid-template-columns: 1fr;
            }
        }

        .card-box {
            background: white;
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        /* Cart Item Row */
        .cart-item-row {
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .cart-item-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .cart-item-img {
            width: 95px;
            height: 95px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: #e0e0e0;
        }

        /* Action Buttons */
        .item-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 13px;
        }

        .action-link {
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 0;
            transition: opacity 0.2s;
        }

        .action-link:hover { opacity: 0.8; }
        .remove-link { color: #d32f2f; }
        .wishlist-link { color: var(--primary-blue); }

        /* Promo Code Bar */
        .promo-tags-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .promo-tag {
            background: #e3f2fd;
            color: var(--primary-blue);
            border: 1px dashed var(--primary-blue);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .promo-tag:hover { background: #bbdefb; }

        .coupon-input-group {
            display: flex;
            gap: 10px;
        }

        .coupon-input-group input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .coupon-apply-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .coupon-apply-btn:hover { background: #0056b3; }

        /* Address Quick Preview */
        .address-preview-box {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Price Breakdown Sidebar */
        .price-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 12px;
            color: #555;
        }

        .price-row.total {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-dark);
            border-top: 1px dashed #ccc;
            padding-top: 12px;
            margin-top: 12px;
        }

        .checkout-btn {
            background-color: var(--secondary-orange);
            color: white;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            display: block;
            text-decoration: none;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .checkout-btn:hover { background-color: var(--accent-red); }

        /* Trust Badges */
        .trust-badges {
            display: flex;
            justify-content: space-around;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: var(--text-light);
            text-align: center;
        }

        .trust-badges div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .trust-badges i {
            font-size: 16px;
            color: var(--success-green);
        }

        .empty-cart-box {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 8px;
        }

        .empty-cart-box i {
            font-size: 60px;
            color: #ccc;
            margin-bottom: 15px;
        }

        /* Toast Popup */
        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #212121;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #toast-notification.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo" onclick="window.location.href='index.html'">Shop<span>Sphere</span></div>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="product.html"><i class="fas fa-th-large"></i> Products</a>
            <a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="cart-main-container">
        
        <h2 class="section-title"><i class="fas fa-shopping-cart"></i> My Shopping Cart</h2>

        <!-- Free Delivery Progress Bar -->
        <div class="delivery-progress-banner">
            <div style="font-size: 13px; font-weight: 600; color: var(--text-dark);" id="delivery-text">
                <i class="fas fa-shipping-fast" style="color: var(--primary-blue);"></i> Add items to your cart to unlock <strong>FREE Express Delivery!</strong>
            </div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="delivery-progress-fill"></div>
            </div>
        </div>

        <!-- Saved Address Quick Preview -->
        <div class="address-preview-box">
            <div>
                <i class="fas fa-map-marker-alt" style="color: var(--success-green);"></i> 
                <strong>Delivering to:</strong> BCA Lab, LCB College Campus, Guwahati - 781014
            </div>
            <a href="#" style="color: var(--primary-blue); font-weight: 600; text-decoration: none; font-size: 12px;" onclick="showToast('Address selection modal opened.')">Change</a>
        </div>

        <div id="cart-content-grid" class="cart-grid">
            <!-- Dynamically populated via JS -->
        </div>

    </main>

    <!-- Toast Notification Popup -->
    <div id="toast-notification">
        <i class="fas fa-check-circle" style="color:#2ed573;"></i>
        <span id="toast-message">Action completed successfully!</span>
    </div>

    <script>
        let appliedCouponDiscount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });

        function renderCartPage() {
            const gridContainer = document.getElementById('cart-content-grid');
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];

            if (cart.length === 0) {
                document.getElementById('delivery-progress-fill').style.width = '0%';
                document.getElementById('delivery-text').innerHTML = `<i class="fas fa-shipping-fast" style="color: var(--primary-blue);"></i> Add items worth ₹1,500 to unlock <strong>FREE Express Delivery!</strong>`;
                
                gridContainer.style.gridTemplateColumns = '1fr';
                gridContainer.innerHTML = `
                    <div class="empty-cart-box">
                        <i class="fas fa-shopping-cart"></i>
                        <h2>Your Shopping Cart is Empty</h2>
                        <p style="color: #777; font-size: 14px;">Browse our full catalog and add items to your cart!</p>
                        <button class="checkout-btn" style="width: auto; padding: 10px 30px; display: inline-block; margin-top: 15px;" onclick="window.location.href='product.html'">Shop Now</button>
                    </div>
                `;
                return;
            }

            gridContainer.style.gridTemplateColumns = '';

            let totalMrp = 0;
            let totalSelling = 0;
            let itemsHtml = '';

            cart.forEach((item, index) => {
                const itemMrp = item.price * 1.4;
                totalMrp += itemMrp * item.qty;
                totalSelling += item.price * item.qty;

                itemsHtml += `
                    <div class="cart-item-row">
                        <img src="${item.image}" class="cart-item-img" alt="${item.title}">
                        <div style="flex: 1;">
                            <div style="font-weight: 600; font-size: 15px;">${item.title}</div>
                            <div style="font-size: 12px; color: var(--success-green); font-weight: 600; margin-top: 3px;">
                                <i class="fas fa-truck"></i> Express Delivery by Tomorrow
                            </div>
                            <div style="font-weight: bold; color: var(--text-dark); font-size: 16px; margin-top: 6px;">
                                ₹${item.price.toLocaleString('en-IN')}
                                <span style="font-size: 12px; color: #888; text-decoration: line-through; margin-left: 6px;">₹${Math.round(itemMrp).toLocaleString('en-IN')}</span>
                            </div>
                            
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-top: 10px;">
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                    <span style="font-size: 14px; font-weight: bold; padding: 0 6px;">${item.qty}</span>
                                    <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                                <div class="item-actions">
                                    <button class="action-link wishlist-link" onclick="moveToWishlist(${index})">
                                        <i class="fas fa-heart"></i> Move to Wishlist
                                    </button>
                                    <button class="action-link remove-link" onclick="removeItem(${index})">
                                        <i class="fas fa-trash"></i> Remove
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Update Free Delivery Progress Bar
            const freeDeliveryThreshold = 1500;
            if (totalSelling >= freeDeliveryThreshold) {
                document.getElementById('delivery-progress-fill').style.width = '100%';
                document.getElementById('delivery-text').innerHTML = `<i class="fas fa-check-circle" style="color: var(--success-green);"></i> You have unlocked <strong>FREE Express Delivery!</strong>`;
            } else {
                const diff = freeDeliveryThreshold - totalSelling;
                const percentage = Math.min(100, Math.round((totalSelling / freeDeliveryThreshold) * 100));
                document.getElementById('delivery-progress-fill').style.width = percentage + '%';
                document.getElementById('delivery-text').innerHTML = `<i class="fas fa-shipping-fast" style="color: var(--primary-blue);"></i> Add <strong>₹${diff.toLocaleString('en-IN')}</strong> more to your cart to unlock <strong>FREE Express Delivery!</strong>`;
            }

            const totalSavings = (totalMrp - totalSelling) + appliedCouponDiscount;
            const finalPayable = Math.max(0, totalSelling - appliedCouponDiscount);

            gridContainer.innerHTML = `
                <!-- Left Column: Items List -->
                <div class="card-box">
                    <div style="font-weight: bold; font-size: 16px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        Items in Cart (${cart.length})
                    </div>
                    ${itemsHtml}
                </div>

                <!-- Right Column: Promo Code & Price Breakdown -->
                <div>
                    <!-- Promo Code Bar -->
                    <div class="card-box">
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px;">AI Smart Promo Code</div>
                        <div class="promo-tags-box">
                            <span class="promo-tag" onclick="applyPromoCode('SAVE20')">SAVE20</span>
                            <span class="promo-tag" onclick="applyPromoCode('FREESHIP')">FREESHIP</span>
                            <span class="promo-tag" onclick="applyPromoCode('SHOP100')">SHOP100</span>
                        </div>
                        <div class="coupon-input-group">
                            <input type="text" id="couponInput" placeholder="Enter coupon code">
                            <button class="coupon-apply-btn" onclick="applyPromoFromInput()">Apply</button>
                        </div>
                    </div>

                    <!-- Price Breakdown Sidebar -->
                    <div class="card-box" style="height: fit-content;">
                        <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Price Details</div>
                        
                        <div class="price-row">
                            <span>Total MRP</span>
                            <span>₹${Math.round(totalMrp).toLocaleString('en-IN')}</span>
                        </div>
                        <div class="price-row">
                            <span>Discount on MRP</span>
                            <span style="color: var(--success-green);">- ₹${Math.round(totalMrp - totalSelling).toLocaleString('en-IN')}</span>
                        </div>
                        <div class="price-row">
                            <span>Coupon Discount</span>
                            <span style="color: var(--success-green);">- ₹${appliedCouponDiscount.toLocaleString('en-IN')}</span>
                        </div>
                        <div class="price-row">
                            <span>Delivery Charges</span>
                            <span style="color: var(--success-green);">${totalSelling >= freeDeliveryThreshold ? 'FREE' : '₹40'}</span>
                        </div>
                        <div class="price-row total">
                            <span>Total Amount</span>
                            <span>₹${finalPayable.toLocaleString('en-IN')}</span>
                        </div>

                        <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>

                        <!-- Trust Badges -->
                        <div class="trust-badges">
                            <div>
                                <i class="fas fa-lock"></i>
                                <span>100% Secure<br>Payments</span>
                            </div>
                            <div>
                                <i class="fas fa-undo"></i>
                                <span>Easy 7-Day<br>Returns</span>
                            </div>
                            <div>
                                <i class="fas fa-shield-alt"></i>
                                <span>Verified<br>Authentic</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];
            if (cart[index]) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                    showToast("Item removed from cart.");
                }
                localStorage.setItem('shopSphereCart', JSON.stringify(cart));
                renderCartPage();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('shopSphereCart', JSON.stringify(cart));
            renderCartPage();
            showToast("Item removed from cart.");
        }

        function moveToWishlist(index) {
            let cart = JSON.parse(localStorage.getItem('shopSphereCart')) || [];
            let item = cart[index];
            if (item) {
                let wishlist = JSON.parse(localStorage.getItem('shopSphereWishlist')) || [];
                if (!wishlist.includes(item.title)) {
                    wishlist.push(item.title);
                    localStorage.setItem('shopSphereWishlist', JSON.stringify(wishlist));
                }
                cart.splice(index, 1);
                localStorage.setItem('shopSphereCart', JSON.stringify(cart));
                renderCartPage();
                showToast(`"${item.title}" moved to Wishlist!`);
            }
        }

        function applyPromoCode(code) {
            document.getElementById('couponInput').value = code;
            applyPromoFromInput();
        }

        function applyPromoFromInput() {
            const inputVal = document.getElementById('couponInput').value.trim().toUpperCase();
            if (inputVal === 'SAVE20') {
                appliedCouponDiscount = 200;
                showToast("Coupon 'SAVE20' applied! Saved ₹200.");
            } else if (inputVal === 'FREESHIP') {
                appliedCouponDiscount = 40;
                showToast("Coupon 'FREESHIP' applied! Saved delivery charges.");
            } else if (inputVal === 'SHOP100') {
                appliedCouponDiscount = 100;
                showToast("Coupon 'SHOP100' applied! Saved ₹100.");
            } else {
                showToast("Invalid promo code. Try SAVE20, FREESHIP, or SHOP100.");
                return;
            }
            renderCartPage();
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
