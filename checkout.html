
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | ShopSphere</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f5f7fb; color: #222;
    }
    header {
      background: #172554; color: white;
      padding: 20px 7%; font-size: 24px; font-weight: bold;
    }
    main {
      max-width: 1050px; margin: 30px auto; padding: 16px;
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px;
    }
    section {
      background: white; padding: 24px; border-radius: 12px;
      box-shadow: 0 3px 14px #0000000c;
    }
    h2 { margin-top: 0; }
    label { display: block; margin: 14px 0 6px; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid #ccd2df;
      border-radius: 7px; font: inherit;
    }
    textarea { min-height: 85px; resize: vertical; }
    .payment {
      padding: 13px; border: 1px solid #d5dbea;
      border-radius: 8px; margin: 12px 0;
    }
    .payment input { width: auto; }
    .payment label { display: inline; margin-left: 8px; }
    .item {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid #eee;
    }
    .total {
      display: flex; justify-content: space-between;
      font-weight: bold; font-size: 20px; margin-top: 18px;
    }
    button {
      width: 100%; margin-top: 18px; padding: 14px;
      border: 0; border-radius: 8px; background: #2563eb;
      color: white; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { color: #b91c1c; margin-top: 12px; }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>ShopSphere</header>

<main>
  <section>
    <h2>Delivery Details</h2>
    <form id="checkoutForm">
      <label for="name">Full name</label>
      <input id="name" name="name" required maxlength="100" autocomplete="name">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required autocomplete="email">

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" required
             pattern="[0-9]{10}" maxlength="10"
             title="Enter a 10-digit phone number" autocomplete="tel">

      <label for="address">Full delivery address</label>
      <textarea id="address" name="address" required maxlength="500"
                autocomplete="street-address"></textarea>

      <label for="city">City</label>
      <input id="city" name="city" required maxlength="100"
             autocomplete="address-level2">

      <label for="state">State</label>
      <input id="state" name="state" required maxlength="100"
             autocomplete="address-level1">

      <label for="pincode">PIN code</label>
      <input id="pincode" name="pincode" required
             pattern="[0-9]{6}" maxlength="6"
             title="Enter a 6-digit PIN code" autocomplete="postal-code">

      <h2 style="margin-top:26px">Payment Method</h2>
      <div class="payment">
        <input type="radio" id="cod" name="paymentMethod"
               value="COD" checked>
        <label for="cod">Cash on Delivery</label>
      </div>
      <div class="payment">
        <input type="radio" id="razorpay" name="paymentMethod"
               value="RAZORPAY">
        <label for="razorpay">Pay Online using Razorpay</label>
      </div>

      <button id="placeOrderButton" type="submit">Place Order</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section>
    <h2>Order Summary</h2>
    <div id="cartItems"></div>
    <div class="total">
      <span>Total</span>
      <span id="cartTotal">₹0.00</span>
    </div>
    <p style="color:#666;font-size:13px">
      Final prices and stock must be checked by the server before an order
      is accepted.
    </p>
  </section>
</main>

<script>
  const CART_KEY = "shopSphereCart";
  const API_BASE = ""; // Same origin as your Express server.

  const form = document.getElementById("checkoutForm");
  const message = document.getElementById("message");
  const submitButton = document.getElementById("placeOrderButton");

  function readCart() {
    try {
      const cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
      return Array.isArray(cart) ? cart : [];
    } catch {
      return [];
    }
  }

  function getItemId(item) {
    return item.productId ?? item.id ?? item._id;
  }

  function getQuantity(item) {
    return Number(item.quantity ?? item.qty ?? 1);
  }

  function renderCart() {
    const cart = readCart();
    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    if (!cart.length) {
      container.textContent = "Your cart is empty.";
      document.getElementById("cartTotal").textContent = "₹0.00";
      submitButton.disabled = true;
      return;
    }

    let displayTotal = 0;

    cart.forEach(item => {
      const quantity = getQuantity(item);
      const price = Number(item.price);
      const lineTotal = price * quantity;

      if (!Number.isFinite(price) || price < 0 ||
          !Number.isInteger(quantity) || quantity < 1) {
        throw new Error("Your cart has invalid item details.");
      }

      displayTotal += lineTotal;

      const row = document.createElement("div");
      row.className = "item";

      const title = document.createElement("span");
      title.textContent = `${item.name || item.title || "Product"} × ${quantity}`;

      const priceText = document.createElement("span");
      priceText.textContent = "₹" + lineTotal.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      row.append(title, priceText);
      container.appendChild(row);
    });

    document.getElementById("cartTotal").textContent =
      "₹" + displayTotal.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }

  async function apiPost(path, data) {
    const response = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(data)
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.message || "The server could not process your request.");
    }
    return result;
  }

  function getDeliveryDetails() {
    return {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      address: form.address.value.trim(),
      city: form.city.value.trim(),
      state: form.state.value.trim(),
      pincode: form.pincode.value.trim()
    };
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    message.textContent = "";

    if (!form.reportValidity()) return;

    const cart = readCart();
    if (!cart.length) {
      message.textContent = "Your cart is empty.";
      return;
    }

    submitButton.disabled = true;

    try {
      const paymentMethod =
        form.querySelector('input[name="paymentMethod"]:checked').value;

      // Send product IDs and quantities only. The backend must calculate
      // the real prices and total from trusted database records.
      const items = cart.map(item => ({
        productId: getItemId(item),
        quantity: getQuantity(item)
      }));

      if (items.some(item => !item.productId ||
          !Number.isInteger(item.quantity) || item.quantity < 1)) {
        throw new Error("A cart item is invalid. Please refresh your cart.");
      }

      const delivery = getDeliveryDetails();

      if (paymentMethod === "COD") {
        const result = await apiPost("/api/orders", {
          items,
          delivery,
          paymentMethod: "COD"
        });

        if (!result.orderId && !result.order?._id && !result.order?.id) {
          throw new Error("The server did not return an order ID.");
        }

        const orderId = result.orderId || result.order?._id || result.order?.id;

        localStorage.removeItem(CART_KEY);
        window.location.href =
          "order-success.html?orderId=" + encodeURIComponent(orderId);
        return;
      }

      // The backend must create a Razorpay order using its SECRET KEY.
      const payment = await apiPost("/api/payments/razorpay/order", {
        items,
        delivery
      });

      if (!payment.razorpayOrderId || !payment.keyId || !payment.orderId) {
        throw new Error("The server returned incomplete payment details.");
      }

      const razorpay = new Razorpay({
        key: payment.keyId,
        amount: payment.amount,
        currency: payment.currency || "INR",
        order_id: payment.razorpayOrderId,
        name: "ShopSphere",
        description: "ShopSphere order payment",
        prefill: {
          name: delivery.name,
          email: delivery.email,
          contact: delivery.phone
        },
        handler: async function (response) {
          try {
            message.textContent = "Verifying your payment…";

            // Only the server can verify the signature and mark the order paid.
            const verified = await apiPost("/api/payments/razorpay/verify", {
              orderId: payment.orderId,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            });

            if (!verified.verified) {
              throw new Error("Payment verification failed. Contact support before retrying.");
            }

            localStorage.removeItem(CART_KEY);
            window.location.href =
              "order-success.html?orderId=" +
              encodeURIComponent(payment.orderId);
          } catch (error) {
            message.textContent = error.message;
            submitButton.disabled = false;
          }
        },
        modal: {
          ondismiss: function () {
            message.textContent =
              "Payment was cancelled. Your order has not been confirmed as paid.";
            submitButton.disabled = false;
          }
        },
        theme: { color: "#2563eb" }
      });

      razorpay.on("payment.failed", function () {
        message.textContent =
          "Payment failed. You can try again; check your order status first.";
        submitButton.disabled = false;
      });

      razorpay.open();
    } catch (error) {
      message.textContent = error.message;
      submitButton.disabled = false;
    }
  });

  try {
    renderCart();
  } catch (error) {
    message.textContent = error.message;
    submitButton.disabled = true;
  }
</script>
</body>
</html>
