
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | ShopSphere</title>
    <meta name="description" content="Explore electronics, fashion, shoes, mobiles and appliances at ShopSphere.">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2874f0;
            --orange: #ff9f00;
            --red: #fb641b;
            --green: #388e3c;
            --background: #f1f3f6;
            --dark: #212121;
            --muted: #777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--dark);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px #0002;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
            font-style: italic;
        }

        .logo span {
            color: var(--orange);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-link:hover {
            color: var(--orange);
        }

        .catalog-container {
            max-width: 1250px;
            margin: 28px auto;
            padding: 0 18px;
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            gap: 22px;
        }

        .filter-sidebar,
        .catalog-header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px #0000000c;
        }

        .filter-sidebar {
            height: fit-content;
        }

        .filter-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 14px;
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .clear-button {
            color: var(--primary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .filter-group {
            margin-bottom: 24px;
        }

        .group-heading {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--primary);
        }

        .sub-category-box {
            display: none;
            margin: 8px 0 14px 18px;
            padding-left: 12px;
            border-left: 2px solid #ddd;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .catalog-header p {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .product-card {
            min-width: 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px #00000010;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px #0000001c;
        }

        .product-detail-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .product-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: #f8f8f8;
        }

        .product-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.4;
            min-height: 42px;
            margin: 0 0 8px;
        }

        .product-detail-link:hover .product-title {
            color: var(--primary);
        }

        .rating-badge {
            display: inline-block;
            align-self: flex-start;
            background: var(--green);
            color: white;
            border-radius: 4px;
            padding: 4px 7px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 19px;
            font-weight: bold;
            color: var(--green);
            margin-bottom: 14px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn-add-cart,
        .btn-wishlist {
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add-cart {
            flex: 1;
            background: var(--orange);
            color: white;
        }

        .btn-add-cart:hover {
            background: var(--red);
        }

        .btn-wishlist {
            background: #eee;
            color: #444;
        }

        .btn-wishlist:hover {
            color: var(--red);
        }

        .empty-message {
            grid-column: 1 / -1;
            background: white;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
        }

        #toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            max-width: calc(100% - 48px);
            background: #222;
            color: white;
            padding: 14px 20px;
            border-radius: 7px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(12px);
            transition: 0.25s;
            pointer-events: none;
        }

        #toast-notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .catalog-container {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .product-image {
                height: 150px;
            }

            .product-info {
                padding: 10px;
            }

            .product-title {
                font-size: 13px;
            }

            .btn-add-cart,
            .btn-wishlist {
                padding: 9px 7px;
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 210px;
            }
        }
    </style>
</head>

<body>

<header>
    <a class="logo" href="index.html">Shop<span>Sphere</span></a>

    <nav class="nav-links">
        <a class="nav-link" href="index.html">
            <i class="fas fa-home"></i> Home
        </a>
        <a class="nav-link" href="products.html">
            <i class="fas fa-store"></i> Products
        </a>
        <a class="nav-link" href="wishlist.html">
            <i class="fas fa-heart"></i> Wishlist
        </a>
        <a class="nav-link" href="cart.html">
            <i class="fas fa-shopping-cart"></i> Cart
        </a>
    </nav>
</header>

<main class="catalog-container">

    <aside class="filter-sidebar">
        <div class="filter-title">
            <span>Filters</span>
            <button class="clear-button" type="button" onclick="resetFilters()">
                Clear All
            </button>
        </div>

        <div class="filter-group">
            <span class="group-heading">Categories</span>

            <label class="checkbox-label">
                <input type="checkbox" name="cat" value="electronics"
                       onchange="filterProducts()">
                Electronics &amp; Gadgets
            </label>

            <label class="checkbox-label">
                <input type="checkbox" name="cat" value="fashion"
                       id="fashion-checkbox"
                       onchange="toggleFashionSubcategories(); filterProducts()">
                Fashion &amp; Apparel
            </label>

            <div class="sub-category-box" id="fashion-sub-container">
                <label class="checkbox-label">
                    <input type="checkbox" name="subcat" value="tshirt"
                           onchange="filterProducts()">
                    T-Shirts
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" name="subcat" value="pants"
                           onchange="filterProducts()">
                    Pants &amp; Jeans
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" name="subcat" value="shoes"
                           onchange="filterProducts()">
                    Shoes &amp; Footwear
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" name="subcat" value="jackets"
                           onchange="filterProducts()">
                    Jackets &amp; Hoodies
                </label>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" name="cat" value="appliances"
                       onchange="filterProducts()">
                Home Appliances
            </label>

            <label class="checkbox-label">
                <input type="checkbox" name="cat" value="mobiles"
                       onchange="filterProducts()">
                Mobile Phones
            </label>
        </div>

        <div class="filter-group">
            <label class="group-heading" for="sort-select">Sort Products</label>
            <select id="sort-select" onchange="filterProducts()">
                <option value="default">Relevance / Popularity</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
                <option value="rating">Customer Ratings</option>
            </select>
        </div>
    </aside>

    <section>
        <div class="catalog-header">
            <div>
                Showing <strong id="product-count">0</strong> products
            </div>
            <p>ShopSphere Quality Verified</p>
        </div>

        <div class="product-grid" id="catalog-grid">
            <!-- JavaScript displays the products here. -->
        </div>
    </section>

</main>

<div id="toast-notification" role="status" aria-live="polite">
    <span id="toast-message">Action completed.</span>
</div>

<script>
    // Product IDs must match the IDs used in product-detail.html.
    const masterProducts = [
        {
            id: 1,
            title: "Minimalist Smart Watch",
            category: "electronics",
            subcat: "none",
            price: 2999,
            rating: 4.4,
            image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 2,
            title: "Wireless Bass Headphones",
            category: "electronics",
            subcat: "none",
            price: 1499,
            rating: 4.2,
            image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 3,
            title: "Pro Athletic Running Shoes",
            category: "fashion",
            subcat: "shoes",
            price: 3499,
            rating: 4.6,
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 4,
            title: "Vintage Mirrorless Camera",
            category: "electronics",
            subcat: "none",
            price: 45999,
            rating: 4.8,
            image: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 5,
            title: "Casual Cotton Graphic T-Shirt",
            category: "fashion",
            subcat: "tshirt",
            price: 699,
            rating: 4.3,
            image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 6,
            title: "Classic Slim Fit Denim Jeans",
            category: "fashion",
            subcat: "pants",
            price: 1499,
            rating: 4.5,
            image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 7,
            title: "Winter Warm Fleece Hoodie",
            category: "fashion",
            subcat: "jackets",
            price: 1899,
            rating: 4.7,
            image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 8,
            title: "Portable Waterproof Speaker",
            category: "appliances",
            subcat: "none",
            price: 1799,
            rating: 4.5,
            image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=500&q=80"
        },
        {
            id: 9,
            title: "Flagship 5G Smartphone",
            category: "mobiles",
            subcat: "none",
            price: 28999,
            rating: 4.8,
            image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
        }
    ];

    document.addEventListener("DOMContentLoaded", function () {
        applyUrlFilters();
        filterProducts();
    });

    // Read category and search terms from links such as:
    // products.html?category=electronics&search=headphones
    function applyUrlFilters() {
        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");
        const search = params.get("search");

        if (category) {
            const categoryCheckbox = document.querySelector(
                'input[name="cat"][value="' + category + '"]'
            );

            if (categoryCheckbox) {
                categoryCheckbox.checked = true;
            }
        }

        if (category === "fashion") {
            document.getElementById("fashion-sub-container").style.display = "block";
        }

        // Support direct links to fashion subcategories too.
        const subcategory = params.get("subcategory");
        if (subcategory) {
            const subcategoryCheckbox = document.querySelector(
                'input[name="subcat"][value="' + subcategory + '"]'
            );

            if (subcategoryCheckbox) {
                subcategoryCheckbox.checked = true;
                document.getElementById("fashion-checkbox").checked = true;
                document.getElementById("fashion-sub-container").style.display = "block";
            }
        }

        // The search term is read by filterProducts() from the URL.
        if (search) {
            console.log("Searching products for:", search);
        }
    }

    function toggleFashionSubcategories() {
        const fashionCheckbox = document.getElementById("fashion-checkbox");
        const subContainer = document.getElementById("fashion-sub-container");

        if (fashionCheckbox.checked) {
            subContainer.style.display = "block";
        } else {
            subContainer.style.display = "none";

            document.querySelectorAll('input[name="subcat"]').forEach(function (checkbox) {
                checkbox.checked = false;
            });
        }
    }

    function filterProducts() {
        const selectedCategories = Array.from(
            document.querySelectorAll('input[name="cat"]:checked')
        ).map(function (checkbox) {
            return checkbox.value;
        });

        const selectedSubcategories = Array.from(
            document.querySelectorAll('input[name="subcat"]:checked')
        ).map(function (checkbox) {
            return checkbox.value;
        });

        const sortValue = document.getElementById("sort-select").value;

        const searchTerm = (
            new URLSearchParams(window.location.search).get("search") || ""
        ).toLowerCase().trim();

        let filteredProducts = masterProducts.filter(function (product) {
            const matchesCategory =
                selectedCategories.length === 0 ||
                selectedCategories.includes(product.category);

            const matchesSearch =
                !searchTerm ||
                product.title.toLowerCase().includes(searchTerm);

            const matchesSubcategory =
                !selectedCategories.includes("fashion") ||
                selectedSubcategories.length === 0 ||
                selectedSubcategories.includes(product.subcat);

            return matchesCategory && matchesSearch && matchesSubcategory;
        });

        if (sortValue === "low-high") {
            filteredProducts.sort(function (a, b) {
                return a.price - b.price;
            });
        } else if (sortValue === "high-low") {
            filteredProducts.sort(function (a, b) {
                return b.price - a.price;
            });
        } else if (sortValue === "rating") {
            filteredProducts.sort(function (a, b) {
                return b.rating - a.rating;
            });
        }

        renderCatalog(filteredProducts);
    }

    function renderCatalog(products) {
        const container = document.getElementById("catalog-grid");
        document.getElementById("product-count").textContent = products.length;

        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-message">
                    <h3>No products found.</h3>
                    <p>Try another search or clear your filters.</p>
                    <button class="btn-add-cart" onclick="resetFilters()">
                        Show All Products
                    </button>
                </div>
            `;
            return;
        }

        let html = "";

        products.forEach(function (product) {
            // IMPORTANT: both the image and title pass the correct product ID.
            const detailUrl = "product-detail.html?id=" +
                encodeURIComponent(product.id);

            html += `
                <article class="product-card">

                    <a class="product-detail-link"
                       href="${detailUrl}"
                       aria-label="View ${product.title} details">

                        <img
                            src="${product.image}"
                            class="product-image"
                            alt="${product.title}"
                            loading="lazy"
                        >

                    </a>

                    <div class="product-info">

                        <a class="product-detail-link" href="${detailUrl}">
                            <h3 class="product-title">${product.title}</h3>
                        </a>

                        <div class="rating-badge">
                            ${product.rating}
                            <i class="fas fa-star"></i>
                        </div>

                        <div class="product-price">
                            ₹${product.price.toLocaleString("en-IN")}
                        </div>

                        <div class="btn-row">
                            <button
                                type="button"
                                class="btn-add-cart"
                                onclick="addToCart(${product.id})">
                                <i class="fas fa-shopping-cart"></i>
                                Add to Cart
                            </button>

                            <button
                                type="button"
                                class="btn-wishlist"
                                aria-label="Add ${product.title} to wishlist"
                                onclick="toggleWishlist(${product.id})">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>

                    </div>
                </article>
            `;
        });

        container.innerHTML = html;
    }

    function resetFilters() {
        document.querySelectorAll('input[name="cat"]').forEach(function (checkbox) {
            checkbox.checked = false;
        });

        document.querySelectorAll('input[name="subcat"]').forEach(function (checkbox) {
            checkbox.checked = false;
        });

        document.getElementById("fashion-sub-container").style.display = "none";
        document.getElementById("sort-select").value = "default";

        // Clear URL search/category filters as well.
        window.history.replaceState({}, "", window.location.pathname);

        filterProducts();
    }

    function addToCart(productId) {
        const product = masterProducts.find(function (item) {
            return item.id === productId;
        });

        if (!product) {
            showToast("Product not found.");
            return;
        }

        let cart;

        try {
            cart = JSON.parse(localStorage.getItem("shopSphereCart")) || [];
        } catch (error) {
            cart = [];
        }

        if (!Array.isArray(cart)) {
            cart = [];
        }

        const existingItem = cart.find(function (item) {
            return item.title === product.title;
        });

        if (existingItem) {
            existingItem.qty = (Number(existingItem.qty) || 1) + 1;
        } else {
            cart.push({
                id: product.id,
                title: product.title,
                price: product.price,
                image: product.image,
                qty: 1
            });
        }

        localStorage.setItem("shopSphereCart", JSON.stringify(cart));
        showToast(product.title + " added to cart!");
    }

    function toggleWishlist(productId) {
        const product = masterProducts.find(function (item) {
            return item.id === productId;
        });

        if (!product) {
            showToast("Product not found.");
            return;
        }

        let wishlist;

        try {
            wishlist = JSON.parse(localStorage.getItem("shopSphereWishlist")) || [];
        } catch (error) {
            wishlist = [];
        }

        if (!Array.isArray(wishlist)) {
            wishlist = [];
        }

        if (!wishlist.includes(product.title)) {
            wishlist.push(product.title);
            localStorage.setItem("shopSphereWishlist", JSON.stringify(wishlist));
            showToast(product.title + " added to wishlist!");
        } else {
            showToast(product.title + " is already in your wishlist.");
        }
    }

    let toastTimer;

    function showToast(message) {
        const toast = document.getElementById("toast-notification");
        document.getElementById("toast-message").textContent = message;

        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(function () {
            toast.classList.remove("show");
        }, 2500);
    }
</script>

</body>
</html>
